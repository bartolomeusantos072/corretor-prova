<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor IFMG - Protótipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold text-green-700 mb-6">Configurador de Gabarito - IFMG</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <input type="text" id="titulo" placeholder="Título da Prova"
                    class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="assunto" placeholder="Assunto"
                    class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="date" id="data" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <div class="flex gap-2">
                    <input type="number" id="qtdQuestoes" placeholder="Nº Questões"
                        class="w-1/2 border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                    <input type="number" step="0.1" id="valorTotalProva" placeholder="Valor Total"
                        class="w-1/2 border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>

            <button id="gerarGrade"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition-colors">
                Gerar Grade Inicial
            </button>

            <div id="areaGabarito" class="hidden mt-8 border-t pt-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Marque as Respostas Corretas</h2>
                <div id="grade" class="space-y-2 mb-8"></div>

                <div class="flex flex-wrap gap-4 border-t pt-6">
                    <button id="salvarProva"
                        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 shadow-md">
                        Salvar Gabarito
                    </button>
                    <button id="inserirQuestao"
                        class="bg-orange-500 text-white px-6 py-2 rounded hover:bg-orange-600 shadow-md">
                        + Inserir Questão
                    </button>
                    <button id="exportarJSON" class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-black shadow-md">
                        Exportar JSON
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Provas Salvas no Sistema</h2>
            <div id="listaProvas" class="space-y-3"></div>
        </div>
    </div>

    <!-- Modal de Correção Ajustado -->
    <div id="modalCorrecao"
        class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-2 sm:p-4">

        <!-- Container do Modal: 'w-full h-[95vh]' no mobile e 'max-w-md' no desktop -->
        <div
            class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[98vh] flex flex-col p-4 sm:p-6 overflow-y-auto">

            <!-- Cabeçalho -->
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-xl font-bold text-blue-800">Avaliar Aluno</h3>
                <button onclick="fecharModal()"
                    class="text-gray-400 hover:text-red-500 text-4xl leading-none">&times;</button>
            </div>

            <p id="nomeProvaModal" class="text-xs font-medium text-blue-600 mb-4 bg-blue-50 p-2 rounded italic">
                Prova: ---
            </p>

            <!-- Área da Câmera: Ajustada para ocupar mais espaço -->
            <div class="space-y-4 flex-grow">
                <div class="relative w-full aspect-[3/4] bg-black rounded-lg overflow-hidden border-2 border-gray-300">
                    <video id="videoScan" autoplay playsinline
                        class="absolute inset-0 w-full h-full object-cover"></video>
                    <canvas id="canvasPreview" class="hidden absolute inset-0 w-full h-full object-cover"></canvas>
                    <!-- Guia de Enquadramento (Overlay) -->
                    <div
                        class="absolute inset-0 border-[3px] border-green-500 opacity-50 pointer-events-none m-4 rounded-md">
                        <div class="absolute top-1/2 left-0 w-full h-[1px] bg-green-500 opacity-30"></div>
                    </div>
                </div>

                <!-- Inputs -->
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 mb-1">RA do Aluno</label>
                        <input type="text" id="raAluno"
                            class="w-full border-2 p-2 rounded-lg focus:border-blue-500 outline-none text-sm"
                            placeholder="Digite o RA">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 mb-1">Leitura das
                            Respostas</label>
                        <input type="text" id="campoLeitor"
                            class="w-full border-2 p-2 rounded-lg bg-gray-50 text-sm font-mono" readonly
                            placeholder="Aguardando...">
                    </div>
                </div>
            </div>

            <!-- Resultado Rápido -->
            <div id="resultadoRapido"
                class="mt-4 p-3 rounded-lg bg-green-50 border border-green-200 hidden text-center">
                <p class="text-green-800 font-bold text-sm" id="msgSucesso"></p>
            </div>

            <!-- Ações -->
            <div class="mt-6 flex flex-col sm:flex-row gap-2">
                <button onclick="fecharModal()"
                    class="w-full sm:w-auto px-5 py-3 text-gray-600 hover:bg-gray-100 rounded-lg order-2 sm:order-1">Cancelar</button>
                <button id="btnConfirmarCorrecao"
                    class="w-full sm:flex-grow bg-blue-700 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-800 shadow-lg order-1 sm:order-2">
                    📸 Processar Leitura
                </button>
            </div>
        </div>
    </div>

    </div>
    <script src="https://jsdelivr.net"></script>
    <script async src="https://opencv.org" type="text/javascript"></script>
    <script src="script.js"></script>

</body>

</html>
