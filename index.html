<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor IFMG - Matriz 15x5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuração da Grade Customizada */
        .grid-cols-15 { grid-template-columns: repeat(15, minmax(0, 1fr)); }
        .grid-rows-5 { grid-template-rows: repeat(5, minmax(0, 1fr)); }
        
        .celula-guia {
            border: 0.5px solid rgba(34, 197, 94, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 sm:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Painel de Configuração -->
        <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-green-600">
            <h1 class="text-2xl font-bold text-green-700 mb-6">Configurador de Gabarito - IFMG</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <input type="text" id="titulo" placeholder="Título da Prova" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="assunto" placeholder="Assunto" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="date" id="data" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <div class="flex gap-2">
                    <input type="number" id="qtdQuestoes" placeholder="Nº Questões" class="w-1/2 border p-2 rounded focus:ring-2 focus:ring-green-500">
                    <input type="number" step="0.1" id="valorTotalProva" placeholder="Valor Total" class="w-1/2 border p-2 rounded focus:ring-2 focus:ring-green-500">
                </div>
            </div>

            <button id="gerarGrade" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition-all font-bold">
                Gerar Grade Inicial
            </button>

            <div id="areaGabarito" class="hidden mt-8 border-t pt-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Respostas do Gabarito Oficial</h2>
                <div id="grade" class="space-y-2 mb-8"></div>
                <div class="flex flex-wrap gap-4 border-t pt-6">
                    <button id="salvarProva" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 shadow-md transition-all font-bold">
                        Salvar Gabarito
                    </button>
                </div>
            </div>
        </div>

        <!-- Lista de Provas -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Provas Salvas no Sistema</h2>
            <div id="listaProvas" class="space-y-3 text-sm">
                <!-- Populado via JS -->
            </div>
        </div>
    </div>

    <!-- Modal de Correção -->
    <div id="modalCorrecao" class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-2">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[98vh] flex flex-col p-4">
            
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-blue-800 uppercase tracking-tight">Scanner de Gabarito</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500 text-4xl leading-none">&times;</button>
            </div>

            <div class="space-y-4">
                <!-- ÁREA DA CÂMERA COM GRADE -->
                <div class="relative w-full aspect-[3/4] bg-black rounded-lg overflow-hidden border-2 border-blue-500 shadow-inner">
                    <video id="videoScan" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
                    <canvas id="canvasPreview" class="hidden"></canvas>
                    
                    <!-- Grade de Enquadramento (15 Colunas x 5 Linhas) -->
                    <div id="gridGuia" class="absolute inset-0 grid grid-cols-15 grid-rows-5 pointer-events-none z-10">
                        <!-- O JS preenche aqui -->
                    </div>

                    <!-- Moldura de Destaque / Máscara -->
                    <div class="absolute inset-0 border-[3px] border-green-500 pointer-events-none z-20 opacity-60"></div>
                    <div class="absolute inset-0 shadow-[0_0_0_999px_rgba(0,0,0,0.4)] pointer-events-none"></div>
                </div>

                <!-- Painel de Resultados -->
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">String de Respostas</label>
                    <input type="text" id="campoLeitor" class="w-full bg-white border p-2 rounded font-mono text-sm mb-3 outline-none focus:border-blue-400" readonly placeholder="Aguardando captura...">
                    
                    <div class="bg-gray-900 rounded p-2 overflow-hidden">
                        <pre id="outputOCR" class="text-green-400 text-[10px] font-mono h-20 overflow-y-auto">Pronto para leitura...</pre>
                    </div>
                </div>

                <button id="btnConfirmarCorrecao" class="w-full bg-blue-700 text-white py-4 rounded-xl font-black text-lg hover:bg-blue-800 shadow-lg active:scale-95 transition-all">
                    📸 CAPTURAR E ANALISAR
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts Externos -->
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" type="text/javascript"></script>
    <script src="script.js"></script>
   
</body>
</html>
