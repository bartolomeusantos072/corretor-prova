<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor IFMG - Protótipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<html>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold text-green-700 mb-6">Configurador de Gabarito - IFMG</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <input type="text" id="titulo" placeholder="Título da Prova" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="assunto" placeholder="Assunto" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="date" id="data" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="number" id="qtdQuestoes" placeholder="Nº de Questões (Ex: 10)" class="border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
                <input type="number" step="0.1" id="valorTotalProva" placeholder="Valor Total (Ex: 10)" class="border p-2 rounded">
            </div>

            <button id="gerarGrade" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition-colors">
                Gerar Grade Inicial
            </button>

            <div id="areaGabarito" class="hidden mt-8 border-t pt-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Marque as Respostas Corretas</h2>
                
                <div id="grade" class="space-y-2 mb-8">
                    </div>
                
                <div class="flex flex-wrap gap-4 border-t pt-6">
                    <button id="salvarProva" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 shadow-md">
                        Salvar Gabarito
                    </button>
                    
                    <button id="inserirQuestao" class="bg-orange-500 text-white px-6 py-2 rounded hover:bg-orange-600 shadow-md">
                        + Inserir Questão
                    </button>
                    
                    <button id="exportarJSON" class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-black shadow-md">
                        Exportar JSON
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Provas Salvas no Sistema</h2>
            <div id="listaProvas" class="space-y-3">
                </div>
        </div>
    </div>

    <div id="modalCorrecao" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h3 class="text-xl font-bold text-blue-800">Avaliar Aluno</h3>
            <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500 text-3xl">&times;</button>
        </div>
        
        <p id="nomeProvaModal" class="text-sm font-medium text-blue-600 mb-4 bg-blue-50 p-2 rounded">
            Prova: ---
        </p>

        <div class="space-y-4">
            <div class="relative w-full h-48 bg-black rounded-lg overflow-hidden border-2 border-gray-300">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-2 border-green-500 opacity-30 pointer-events-none m-4"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Passo 1: Identificação</label>
                <input type="text" id="raAluno" class="w-full border-2 p-2 rounded-lg outline-none focus:border-blue-500" placeholder="Digite o RA">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Passo 2: Resultado da Leitura</label>
                <input type="text" id="campoLeitor" class="w-full border-2 p-2 rounded-lg bg-gray-50 outline-none" placeholder="O resultado aparecerá aqui...">
            </div>
        </div>

        <div id="resultadoRapido" class="mt-4 p-3 rounded-lg bg-green-50 hidden text-center"></div>

        <div class="mt-6 flex justify-end gap-3">
            <button onclick="fecharModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Fechar</button>
            <button id="btnConfirmarCorrecao" class="bg-blue-700 text-white px-6 py-2 rounded-lg hover:bg-blue-800">Processar Leitura</button>
        </div>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
